name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests · code style · static analysis · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan, level 5)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Test suite (SQLite in memory, AI faked)
        run: php artisan test
